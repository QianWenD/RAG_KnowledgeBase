<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 | RAGPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260608-display-pass">
</head>
<body class="auth-page register-page" data-auth-mode="register">
  <div class="scene-grid" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>

  <main class="auth-shell">
    <section class="auth-stage">
      <article class="login-brief" aria-label="账号创建说明">
        <p class="login-eyebrow">Identity Bootstrap</p>
        <h1 class="login-hero-title">先建立身份，再打开知识权限</h1>
        <p class="login-hero-copy">
          RAGPro 会把账号、组织、菜单角色和知识来源权限串成一条治理链路。首个注册账号将成为管理员，用来完成后续用户授权和上线初始化。
        </p>
        <div class="login-radar-card" aria-hidden="true">
          <div class="login-radar-orbit"></div>
          <div class="login-radar-node node-a"></div>
          <div class="login-radar-node node-b"></div>
          <div class="login-radar-node node-c"></div>
          <span class="login-radar-label">Access Signal</span>
        </div>
        <div class="login-capability-grid" aria-label="注册能力">
          <span>首个管理员</span>
          <span>来源授权</span>
          <span>菜单角色</span>
          <span>自动登录</span>
        </div>
      </article>

      <section class="auth-card-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">RAGPro Identity Console</p>
            <h2 class="auth-login-title">创建系统账号</h2>
          </div>
          <span class="status-chip">/register</span>
        </div>
        <p class="login-card-copy">请设置用户名和密码。注册成功后会自动登录，并跳转到主工作台继续完成权限初始化。</p>
        <div id="auth-status" class="upload-result auth-notice" role="status" aria-live="polite">请输入用户名和密码创建账号。</div>

        <form id="register-form" class="auth-form auth-form-solo">
          <label class="field-block" for="register-username">
            <span>用户名</span>
            <input id="register-username" type="text" autocomplete="username" placeholder="支持字母、数字或下划线">
          </label>
          <label class="field-block" for="register-password">
            <span>密码</span>
            <input id="register-password" type="password" autocomplete="new-password" placeholder="建议至少 8 位">
          </label>
          <div class="auth-form-actions">
            <button id="register-submit-btn" class="send-btn" type="submit">创建账号</button>
          </div>
        </form>

        <div class="auth-link-row">
          <span class="subtle">已经有账号？</span>
          <a class="ghost-link" href="/login">去登录</a>
        </div>
      </section>
    </section>
  </main>

  <script src="/static/auth.js?v=20260608-display-pass"></script>
</body>
</html>
