<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGPro 知识运营 · 数据源管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260528-file-filter-range">
</head>
<body class="console-page" data-page="knowledge" data-page-view="knowledge-sources" data-page-label="数据源管理">
  <div class="scene-grid" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>

  <div class="shell">
    <aside class="rail">
      <section class="panel nav-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">主导航</p>
            <h2>页面入口</h2>
          </div>
        </div>
        <div class="nav-links nav-links-single">
          <a class="nav-link" data-nav="dashboard" href="/">总览</a>
          <a class="nav-link" data-nav="qa" href="/qa">问答工作台</a>
          <a class="nav-link" data-nav="knowledge" href="/knowledge">知识运营</a>
          <a class="nav-link" data-nav="users" data-admin-nav href="/users">权限管理</a>
        </div>
      </section>

      <section id="auth-panel" class="panel auth-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">当前账号</p>
            <h2>登录状态</h2>
          </div>
          <span id="auth-badge" class="status-chip">检查中</span>
        </div>
        <div id="auth-summary" class="auth-summary">
          <p class="note">系统正在检查当前会话和可见来源范围。</p>
        </div>
        <div id="auth-user-card" class="auth-card hidden">
          <div class="stack">
            <strong id="auth-username">-</strong>
            <span id="auth-role" class="subtle">-</span>
          </div>
          <div class="stack">
            <span class="label">可见来源</span>
            <div id="auth-source-tags" class="tag-list"></div>
          </div>
          <div class="session-actions">
            <button id="auth-refresh-btn" class="ghost-btn" type="button">刷新状态</button>
            <button id="change-password-btn" class="ghost-btn" type="button">修改密码</button>
            <button id="logout-btn" class="ghost-btn danger" type="button">退出登录</button>
          </div>
        </div>
      </section>
    </aside>

    <main class="board page-board">

      <nav class="module-nav-bar" aria-label="知识运营子导航">
        <a class="module-nav-link" data-module-nav="knowledge-upload" href="/knowledge">上传入库</a>
      </nav>

      <section class="knowledge-workbench source-management-layout">
        <section class="panel source-management-workbench document-file-panel" id="document-file-panel">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">文件管理</p>
              <h2>已入库文件</h2>
            </div>
            <button id="document-file-refresh" class="ghost-btn" type="button">刷新</button>
          </div>

          <div class="source-filter-row document-file-filter-row">
            <form id="document-file-filter-form" class="document-file-filter-form">
              <label class="field-block" for="document-file-filter-filename">
                <span>文件</span>
                <input id="document-file-filter-filename" type="search" maxlength="180" placeholder="输入文件名">
              </label>
              <label class="field-block" for="document-file-filter-source">
                <span>来源</span>
                <input id="document-file-filter-source" type="search" maxlength="50" placeholder="例如 ai">
              </label>
              <label class="field-block" for="document-file-filter-uploader">
                <span>入库人员</span>
                <input id="document-file-filter-uploader" type="search" maxlength="64" placeholder="姓名或账号">
              </label>
              <div class="document-file-time-range">
                <span class="document-file-time-label">上传时间</span>
                <div class="document-file-time-controls">
                  <div id="document-file-time-presets" class="document-file-time-presets" aria-label="上传时间快捷筛选">
                    <button class="document-file-range-chip is-active" type="button" data-document-file-range="all" aria-pressed="true">全部</button>
                    <button class="document-file-range-chip" type="button" data-document-file-range="today" aria-pressed="false">今天</button>
                    <button class="document-file-range-chip" type="button" data-document-file-range="7" aria-pressed="false">近7天</button>
                    <button class="document-file-range-chip" type="button" data-document-file-range="30" aria-pressed="false">近30天</button>
                    <button class="document-file-range-chip" type="button" data-document-file-range="month" aria-pressed="false">本月</button>
                    <button class="document-file-range-chip" type="button" data-document-file-range="custom" aria-pressed="false">自定义</button>
                  </div>
                  <div id="document-file-custom-range" class="document-file-custom-range" hidden>
                    <input id="document-file-filter-created-from" type="date" aria-label="上传开始日期">
                    <span class="document-file-time-separator">至</span>
                    <input id="document-file-filter-created-to" type="date" aria-label="上传结束日期">
                  </div>
                </div>
              </div>
              <div class="document-file-filter-actions">
                <button id="document-file-filter-submit" class="send-btn" type="submit">查询</button>
                <button id="document-file-filter-reset" class="ghost-btn" type="button">重置</button>
              </div>
            </form>
          </div>

          <div class="source-table-wrap document-file-table-wrap">
            <table id="document-file-table" class="source-table document-file-table">
              <thead>
                <tr>
                  <th>文件名</th>
                  <th>来源</th>
                  <th>入库人员</th>
                  <th>大小</th>
                  <th>切块</th>
                  <th>上传时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="document-file-table-body">
                <tr>
                  <td colspan="7">正在加载已入库文件。</td>
                </tr>
              </tbody>
            </table>
            <div id="document-file-pager" class="source-table-pager">共 0 个文件</div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="/static/common.js?v=20260528-topbar-cleanup"></script>
  <script src="/static/knowledge_sources.js?v=20260528-file-filter-range"></script>
</body>
</html>
