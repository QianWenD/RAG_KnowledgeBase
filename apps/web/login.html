<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | RAGPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-page login-page" data-auth-mode="login">
  <div class="scene-grid" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>

  <main class="auth-shell">
    <section class="auth-stage">
      <article class="login-brief" aria-label="系统说明">
        <p class="login-eyebrow">Enterprise Knowledge Ops</p>
        <h1 class="login-hero-title">RAG知识中心平台</h1>
      </article>

      <section class="auth-card-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">RAGPro Secure Console</p>
            <h1 class="auth-login-title">知识中心平台</h1>
          </div>
        </div>
        <div id="auth-status" class="upload-result auth-notice" role="status" aria-live="polite"></div>

        <form id="login-form" class="auth-form auth-form-solo">
          <label class="field-block" for="login-username">
            <span>登录账号</span>
            <input id="login-username" type="text" autocomplete="username" placeholder="请输入登录账号">
          </label>
          <label class="field-block" for="login-password">
            <span>密码</span>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入登录密码">
          </label>
          <div class="auth-form-actions">
            <button id="login-submit-btn" class="send-btn" type="submit">登录</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="/static/auth.js?v=20260427-login-fix"></script>
</body>
</html>
