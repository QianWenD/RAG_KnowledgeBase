<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | RAGPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-page login-page" data-auth-mode="login">
  <div class="scene-grid" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>

  <main class="auth-shell">
    <section class="auth-stage">
      <article class="login-brief" aria-label="系统说明">
        <p class="login-eyebrow">Enterprise Knowledge Ops</p>
        <h1 class="login-hero-title">把企业知识库变成可以追问的工作台</h1>
        <p class="login-hero-copy">
          RAGPro 将资料上传、知识源权限、检索增强问答和审计追踪放在同一个控制台里，帮助团队把分散文档沉淀成可验证的业务答案。
        </p>
        <div class="login-radar-card" aria-hidden="true">
          <div class="login-radar-orbit"></div>
          <div class="login-radar-node node-a"></div>
          <div class="login-radar-node node-b"></div>
          <div class="login-radar-node node-c"></div>
          <span class="login-radar-label">Knowledge Signal</span>
        </div>
        <div class="login-capability-grid" aria-label="系统能力">
          <span>知识上传</span>
          <span>权限隔离</span>
          <span>RAG 问答</span>
          <span>审计追踪</span>
        </div>
      </article>

      <section class="auth-card-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">RAGPro Secure Console</p>
            <h1 class="auth-login-title">进入知识中枢</h1>
          </div>
        </div>
        <p class="login-card-copy">请使用已授权账号登录。系统会根据账号权限自动加载可访问的知识源、菜单和审计范围。</p>
        <div id="auth-status" class="upload-result auth-notice" role="status" aria-live="polite">请输入账号和密码。</div>

        <form id="login-form" class="auth-form auth-form-solo">
          <label class="field-block" for="login-username">
            <span>登录账号</span>
            <input id="login-username" type="text" autocomplete="username" placeholder="请输入登录账号">
          </label>
          <label class="field-block" for="login-password">
            <span>密码</span>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入登录密码">
          </label>
          <div class="auth-form-actions">
            <button id="login-submit-btn" class="send-btn" type="submit">登录</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="/static/auth.js?v=20260427-login-fix"></script>
</body>
</html>
