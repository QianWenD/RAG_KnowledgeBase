<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGPro 问答工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260528-topbar-cleanup">
</head>
<body class="console-page" data-page="qa">
  <div class="scene-grid" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>

  <div class="shell">
    <aside class="rail">
      <section class="panel nav-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">主导航</p>
            <h2>页面入口</h2>
          </div>
        </div>
        <div class="nav-links nav-links-single">
          <a class="nav-link" data-nav="dashboard" href="/">总览</a>
          <a class="nav-link" data-nav="qa" href="/qa">问答工作台</a>
          <a class="nav-link" data-nav="knowledge" href="/knowledge">知识运营</a>
          <a class="nav-link" data-nav="users" data-admin-nav href="/users">权限管理</a>
        </div>
      </section>

      <section id="auth-panel" class="panel auth-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">当前账号</p>
            <h2>登录状态</h2>
          </div>
          <span id="auth-badge" class="status-chip">检查中</span>
        </div>
        <div id="auth-summary" class="auth-summary">
          <p class="note">系统正在检查当前会话和可见来源范围。</p>
        </div>
        <div id="auth-user-card" class="auth-card hidden">
          <div class="stack">
            <strong id="auth-username">-</strong>
            <span id="auth-role" class="subtle">-</span>
          </div>
          <div class="stack">
            <span class="label">可见来源</span>
            <div id="auth-source-tags" class="tag-list"></div>
          </div>
          <div class="session-actions">
            <button id="auth-refresh-btn" class="ghost-btn" type="button">刷新状态</button>
            <button id="change-password-btn" class="ghost-btn" type="button">修改密码</button>
            <button id="logout-btn" class="ghost-btn danger" type="button">退出登录</button>
          </div>
        </div>
      </section>
    </aside>

    <main class="board page-board">

      <section class="content-grid">
        <section class="primary-column">
          <section class="panel section-panel qa-workbench-panel" id="qa-workbench">
            <section class="panel conversation">
              <div id="message-list" class="message-list">
                <article class="message system">
                  <div class="message-body">可以直接提问。我会在这里给出回答，右侧保留路由、引用和最近记录。</div>
                </article>
              </div>

              <div class="composer-wrap">
                <div class="composer">
                  <div id="qa-prompt-suggestions" class="qa-suggestion-row" aria-label="示例问题">
                    <button class="suggestion-chip" type="button" data-prompt-suggestion="什么是大语言模型？">什么是大语言模型？</button>
                    <button class="suggestion-chip" type="button" data-prompt-suggestion="当前 AI 资料里有哪些重点内容？">当前 AI 资料重点</button>
                    <button class="suggestion-chip" type="button" data-prompt-suggestion="请总结这个知识库最值得先学习的三个方向。">总结三个学习方向</button>
                  </div>
                  <textarea id="query-input" placeholder="请输入问题，例如：什么是大语言模型？当前 AI 资料里有哪些重点内容？"></textarea>

                  <div class="composer-footer">
                    <div class="composer-toolbar-main" aria-live="polite">
                      <label class="composer-source-control" for="source-filter">
                        <span class="composer-tool-label">源</span>
                        <select id="source-filter">
                          <option value="">正在加载来源</option>
                        </select>
                      </label>
                      <label class="toggle composer-stream-toggle">
                        <input id="stream-mode" type="checkbox" checked>
                        <span>流式</span>
                      </label>
                      <span id="query-input-meter" class="composer-meter">0 字</span>
                      <span id="query-source-hint" class="composer-source-hint" hidden></span>
                    </div>
                    <div class="composer-actions">
                      <button id="send-btn" class="send-btn" type="button" aria-label="发送问题" data-loading="false">
                        <span class="send-btn-icon" aria-hidden="true">↑</span>
                        <span class="send-btn-label">发送问题</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </section>
        </section>

        <aside class="workspace-side">
          <section class="panel qa-context-panel" aria-label="问答上下文">
            <div class="qa-context-tabs" role="tablist" aria-label="上下文切换">
              <button class="qa-context-tab" id="qa-tab-session" type="button" role="tab" aria-selected="false" aria-controls="qa-context-session" data-qa-context-tab="session">会话</button>
              <button class="qa-context-tab is-active" id="qa-tab-route" type="button" role="tab" aria-selected="true" aria-controls="route-insights" data-qa-context-tab="route">路由</button>
              <button class="qa-context-tab" id="qa-tab-citations" type="button" role="tab" aria-selected="false" aria-controls="qa-context-citations" data-qa-context-tab="citations">引用</button>
              <button class="qa-context-tab" id="qa-tab-history" type="button" role="tab" aria-selected="false" aria-controls="history-center" data-qa-context-tab="history">历史</button>
            </div>
            <div class="qa-current-turn" aria-live="polite">
              <span>当前问题</span>
              <strong id="qa-current-question">尚未提问</strong>
              <small id="qa-current-stage">等待输入</small>
            </div>

            <section class="qa-context-pane" id="qa-context-session" role="tabpanel" aria-labelledby="qa-tab-session" data-qa-context-pane="session" hidden>
              <div class="qa-context-head">
                <div>
                  <p class="panel-kicker">当前会话</p>
                  <h2>会话操作</h2>
                </div>
                <button id="new-session-btn" class="ghost-btn" type="button">新建会话</button>
              </div>
              <div class="session-row">
                <span class="label">会话 ID</span>
                <code id="session-id">尚未创建</code>
              </div>
              <div class="session-actions">
                <button id="copy-session-btn" class="ghost-btn" type="button">复制会话 ID</button>
                <button id="clear-history-btn" class="ghost-btn danger" type="button">清空历史</button>
              </div>
            </section>

            <section class="qa-context-pane is-active" id="route-insights" role="tabpanel" aria-labelledby="qa-tab-route" data-qa-context-pane="route">
              <div class="qa-context-head">
                <div>
                  <p class="panel-kicker">路由说明</p>
                  <h2>路由结果</h2>
                </div>
              </div>
              <div class="qa-meta-rail" aria-label="最近一次回答状态">
                <div class="qa-meta-pill">
                  <span>路由</span>
                  <strong id="meta-route">-</strong>
                </div>
                <div class="qa-meta-pill">
                  <span>意图</span>
                  <strong id="meta-intent">-</strong>
                </div>
                <div class="qa-meta-pill">
                  <span>策略</span>
                  <strong id="meta-strategy">-</strong>
                </div>
                <div class="qa-meta-pill">
                  <span>后端</span>
                  <strong id="meta-backend">-</strong>
                </div>
                <div class="qa-meta-pill">
                  <span>上下文</span>
                  <strong id="meta-context">0</strong>
                </div>
              </div>
              <div id="qa-route-detail-list" class="qa-detail-list" aria-live="polite"></div>
            </section>

            <section class="qa-context-pane" id="qa-context-citations" role="tabpanel" aria-labelledby="qa-tab-citations" data-qa-context-pane="citations" hidden>
              <div class="qa-context-head">
                <div>
                  <p class="panel-kicker">引用证据</p>
                  <h2>检索命中</h2>
                </div>
              </div>
              <div id="citations-list" class="citation-list">
                <div class="note">当前还没有引用内容。</div>
              </div>
            </section>

            <section class="qa-context-pane" id="history-center" role="tabpanel" aria-labelledby="qa-tab-history" data-qa-context-pane="history" hidden>
              <div id="session-list" class="session-list">
                <div class="note">当前还没有加载历史会话。</div>
              </div>
              <div class="session-row">
                <span class="label">历史条数</span>
                <span id="history-count" class="subtle">0 条</span>
              </div>
              <div id="history-list" class="history-list">
                <div class="note">当前还没有加载历史记录。</div>
              </div>
            </section>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <template id="message-template">
    <article class="message">
      <div class="message-body"></div>
    </article>
  </template>

  <script src="/static/common.js?v=20260528-topbar-cleanup"></script>
  <script src="/static/qa.js"></script>
</body>
</html>
